name: Build Windows executable

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained executable
        run: >-
          dotnet publish SteamOverlayOSC.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -p:ContinuousIntegrationBuild=true
          -o ./release

      - name: Verify executable and startup
        run: |
          if (-not (Test-Path -LiteralPath ./release/SteamOverlayOSC.exe -PathType Leaf)) {
            throw 'Expected executable was not found: ./release/SteamOverlayOSC.exe'
          }
          & ./release/SteamOverlayOSC.exe --help
          if ($LASTEXITCODE -ne 0) {
            throw 'The published executable failed its startup check.'
          }

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: SteamOverlayOSC-win-x64-${{ github.sha }}
          path: ./release/SteamOverlayOSC.exe
          if-no-files-found: error
